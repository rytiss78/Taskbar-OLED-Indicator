name: Build experimental DLL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Verify architecture and exports
        shell: pwsh
        run: |
          $dll = 'build/Release/AcRes.dll'
          if (!(Test-Path $dll)) { throw 'DLL not produced' }
          dumpbin /headers $dll | Select-String '8664 machine'
          if ($LASTEXITCODE -ne 0) { throw 'Not a valid x64 DLL' }
          dumpbin /exports $dll | Select-String 'GetHookAPIs|NotifyShims'
          if ($LASTEXITCODE -ne 0) { throw 'Required shim exports missing' }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/AcRes.dll package/
          Copy-Item README.md package/
          @'
          EXPERIMENTAL DLL ONLY — NOT AN INSTALLER.
          Target: Windows 11 x64 build 26300.9711.
          Do not copy this DLL into System32 or install an SDB with it.
          This artifact has not been runtime-validated. Keep Task Manager available.
          '@ | Set-Content package/TEST-WARNING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Taskbar-OLED-Indicator-experimental-x64
          path: package/
          retention-days: 14
